<template>
    <div class="ace-portal portal">
        <template lwc:if={loading}>
            <div class="shell-panel">
                <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
            </div>
        </template>

        <template lwc:elseif={showAccessQuestion}>
            <!-- Decision before the package forms: Yes = Form 7300 + PGA package, No = Form 7300 only. -->
            <section class="card" aria-labelledby="access-question-title">
                <div class="card__head">
                    <p class="card__step">Before you start</p>
                    <h2 id="access-question-title">Are you requesting ACE Portal access?</h2>
                    <p>Your answer decides which forms you complete.</p>
                </div>
                <div class="card__body">
                    <lightning-radio-group
                        name="aceAccessAnswer"
                        label="Are you requesting ACE Portal access?"
                        variant="label-hidden"
                        options={accessAnswerOptions}
                        value={accessAnswerDraft}
                        onchange={handleAccessAnswerChange}
                        required
                    ></lightning-radio-group>
                    <template lwc:if={accessAnswerError}>
                        <p class="notice notice--error" role="alert">{accessAnswerError}</p>
                    </template>
                    <div class="actions">
                        <button type="button" class="slds-button slds-button_brand" onclick={handleAccessAnswerSave}>Continue</button>
                    </div>
                </div>
            </section>
        </template>

        <template lwc:else>
            <template lwc:if={progress}>
                <section class="notice notice--info request-status" aria-labelledby="request-status-title">
                    <h2 id="request-status-title" class="request-status__title">Where your request is</h2>
                    <p class="request-status__stage"><strong>{progress.stage}</strong></p>
                    <template lwc:if={progress.waitingOn}>
                        <p>Waiting on: {progress.waitingOn}</p>
                    </template>
                    <template lwc:if={hasOpenForms}>
                        <p>Your forms still open: {openFormsText}</p>
                    </template>
                    <p class="request-status__path">
                        {accessPathText}
                        <template lwc:if={canChangeAnswer}>
                            <button type="button" class="slds-button slds-m-left_x-small" onclick={handleChangeAnswer}>Change answer</button>
                        </template>
                    </p>
                </section>
            </template>
            <div class="layout-workspace">
                <section class="progress-dashboard" aria-labelledby="progress-title">
                    <h2 id="progress-title">Your progress</h2>
                    <ol class="steps-dashboard">
                        <template for:each={steps} for:item="step">
                            <li key={step.id} class={step.className} aria-current={step.ariaCurrent}>
                                <button
                                    type="button"
                                    class="step-card"
                                    data-id={step.id}
                                    onclick={handleSelect}
                                    disabled={step.locked}
                                >
                                    <div class="step-card-inner">
                                        <span class="step__num" aria-hidden="true">{step.index}</span>
                                        <div>
                                            <p class="step__title">
                                                <span class="sr-only">Step {step.index}: </span>
                                                {step.title}
                                                <template lwc:if={step.isCurrent}>
                                                    <span class="sr-only"> (current step)</span>
                                                </template>
                                            </p>
                                            <p class="step__meta">{step.role}</p>
                                            <span class={step.badgeClass}>
                                                <span class="sr-only">Status: </span>
                                                {step.statusLabel}
                                            </span>
                                        </div>
                                    </div>
                                </button>
                            </li>
                        </template>
                    </ol>
                </section>

                <div id="portal-main" tabindex="-1">
                    <section class="card" aria-labelledby="form-title">
                        <div class="card__head">
                            <p class="card__step">{formCardHead.step}</p>
                            <h2 id="form-title">{formCardHead.title}</h2>
                            <p>{formCardHead.summary}</p>
                        </div>
                        <div class="card__body">
                            <template lwc:if={showAccess}>
                                <c-ace-form-access2 record-id={packageRecordId}></c-ace-form-access2>
                            </template>
                            <template lwc:if={showRules}>
                                <c-ace-form-rules2 record-id={packageRecordId}></c-ace-form-rules2>
                            </template>
                            <template lwc:if={showNdaUpload}>
                                <c-ace-nda-upload record-id={packageRecordId}></c-ace-nda-upload>
                            </template>
                            <template lwc:if={show7300}>
                                <!-- Form 7300 Test 2 (cbpForm73002): the current CBP Form 7300 web form. -->
                                <template lwc:if={showLinkedForm7300}>
                                    <p class="notice notice--success" role="status">
                                        Form 7300 submitted. Confirmation number: <strong>{linkedForm7300.confirmationNumber}</strong>
                                    </p>
                                    <c-cbp-form7300-progress record-id={linkedForm7300.formId}></c-cbp-form7300-progress>
                                </template>
                                <template lwc:else>
                                    <c-cbp-form73002 oncertificationcomplete={handleCbpForm7300Complete}></c-cbp-form73002>
                                </template>
                            </template>
                        </div>
                    </section>
                </div>
            </div>
        </template>
    </div>
</template>
